<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RetroRestore — Eski Fotoğraf ve Video İyileştirme</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">◐</span>
    <div>
      <h1>RetroRestore</h1>
      <p>Eski fotoğraf ve videolarınızı yapay zekâ ile netleştirin, büyütün ve renklendirin</p>
    </div>
  </div>
  <div id="sysBadge" class="sys-badge" title="Donanım durumu">…</div>
</header>

<main>
  <div class="grid-2">
    <div class="card">
      <h2>1 · Dosyanızı yükleyin</h2>
      <label id="dropzone" class="dropzone">
        <input type="file" id="fileInput" accept="image/*,video/*" hidden>
        <span class="dz-icon">⇪</span>
        <span><b>Fotoğraf veya video sürükleyin</b> ya da tıklayıp seçin</span>
        <small id="dzHint">JPG, PNG, TIFF, WEBP · MP4, MOV, AVI, MKV</small>
      </label>
      <div id="inputPreview" class="input-preview"></div>
    </div>

    <div class="card">
      <h2>2 · Ayarlar</h2>
      <form id="optsForm" class="opts">
        <label>Büyütme oranı <output id="scaleOut">2×</output>
          <input type="range" name="scale" min="1" max="4" step="1" value="2">
        </label>
        <label>Gürültü temizleme <output id="denoiseOut">0.50</output>
          <input type="range" name="denoise" min="0" max="1" step="0.05" value="0.5">
        </label>
        <label>Renk
          <select name="color_mode">
            <option value="auto">Otomatik (siyah-beyazsa renklendir, renkliyse canlandır)</option>
            <option value="restore">Solmuş renkleri canlandır</option>
            <option value="colorize">Siyah-beyazı renklendir</option>
            <option value="none">Renge dokunma</option>
          </select>
        </label>
        <label>Renk yoğunluğu <output id="colorOut">0.80</output>
          <input type="range" name="color_strength" min="0" max="1.5" step="0.05" value="0.8">
        </label>
        <label class="chk"><input type="checkbox" name="scratch_removal"> Çizik ve toz lekelerini temizle</label>
        <details class="adv">
          <summary>Gelişmiş</summary>
          <label>Yöntem
            <select name="sr_method">
              <option value="realesrgan">Real-ESRGAN (önerilen)</option>
              <option value="classical">Klasik filtreler</option>
              <option value="lanczos">Lanczos</option>
              <option value="bicubic">Bicubic</option>
              <option value="none">Büyütme yok, yalnızca onarım</option>
            </select>
          </label>
          <label>Model
            <select name="model" id="modelSelect"><option value="auto">Otomatik</option></select>
          </label>
          <label>Keskinleştirme <output id="sharpOut">0.00</output>
            <input type="range" name="sharpen" min="0" max="1.5" step="0.05" value="0">
          </label>
          <label>Çıktı biçimi
            <select name="output_format"><option>png</option><option>jpg</option><option>webp</option></select>
          </label>
          <div class="video-only">
            <label>Video: yalnızca ilk N saniyeyi işle (0 = tümü)
              <input type="number" name="preview_seconds" value="0" min="0" step="1">
            </label>
          </div>
        </details>
        <button type="submit" id="runBtn" class="btn primary" disabled>İyileştir</button>
      </form>
    </div>
  </div>

  <div id="jobCard" class="card hidden">
    <div class="job-head">
      <h2>3 · Sonuç</h2>
      <div class="job-actions">
        <button id="cancelBtn" class="btn ghost">İptal</button>
        <a id="downloadBtn" class="btn primary hidden" href="#">Sonucu indir</a>
      </div>
    </div>
    <div class="progress"><div id="progBar"></div></div>
    <p id="progMsg" class="muted">—</p>
    <div id="warnings"></div>
    <div id="resultView"></div>
    <div id="metricsView"></div>
  </div>
</main>

<footer class="foot">
  RetroRestore · <a href="https://github.com/aysecetin0/retro-restore" target="_blank" rel="noopener">github.com/aysecetin0/retro-restore</a>
</footer>

<script src="/static/js/app.js"></script>
</body>
</html>
